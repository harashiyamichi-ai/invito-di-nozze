<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="rsvpModal">
    <div class="modal">
      <h2>Confirmação de Presença</h2>
      <input id="nome" type="text" placeholder="Nome completo">
      <input id="telefone" type="text" placeholder="Telefone">

      <select id="presenca">
        <option>Sim</option>
        <option>Não</option>
      </select>

      <input id="acompanhantes" type="number" min="0" value="0" placeholder="Quantidade de acompanhantes">

      <textarea id="nomesAcompanhantes" placeholder="Nome dos acompanhantes"></textarea>
      <textarea id="obs" placeholder="Observações"></textarea>

      <button onclick="enviarWhatsapp()">Confirmar</button>
      <button onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
